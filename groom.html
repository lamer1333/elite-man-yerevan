<style>
/* Groom: Huntsman's wedding page (hero, looks by role, timeline, accessories, questions), studio.parc-style switching between roles */
.roles { display: inline-flex; border: 1px solid var(--line); margin-bottom: 28px; max-width: 100%; overflow-x: auto; }
.role { background: var(--paper); border: 0; padding: 12px 20px; font: 400 12.5px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); cursor: pointer; flex: none; }
.role + .role { border-left: 1px solid var(--line); }
.role:hover { color: var(--ink); }
.role[aria-pressed="true"] { background: var(--ink); color: #fff; }
.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 1.8vw, 24px); }
.lk { display: grid; gap: 12px; align-content: start; animation: up .6s var(--ease) both; animation-delay: calc(var(--d, 0) * 80ms); }
.lk .ph { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; }
.lk .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #12121233, transparent 40%); pointer-events: none; }
.lk h3 { font-size: 15px; letter-spacing: 0.1em; line-height: 1.3; }
.lk p { font-size: 14.5px; color: var(--muted); }
.lk ul { list-style: none; margin: 0; padding: 0; font-size: 13.5px; display: grid; gap: 4px; }
.lk ul li::before { content: "— "; color: var(--muted); }
.lk-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.lk-foot b { font-weight: 400; font-size: 13px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.group-note { margin-top: 26px; padding: 16px 18px; background: var(--soft); font-size: 14.5px; display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.plan { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 80px); align-items: start; }
.plan-head { position: sticky; top: calc(var(--hh) + 30px); display: grid; gap: 14px; }
.plan-head p { color: var(--muted); max-width: 40ch; }
.tl { position: relative; list-style: none; margin: 0; padding: 0 0 0 34px; display: grid; gap: clamp(26px, 3vw, 40px); }
.tl::before, .tl::after { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.tl::after { background: var(--accent); bottom: auto; height: calc((100% - 16px) * var(--p, 0)); }
.tl li { position: relative; display: grid; gap: 6px; }
.tl li::before { content: ""; position: absolute; left: -34px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 1px solid var(--muted); transition: background .4s, border-color .4s; }
.tl li.on::before { background: var(--accent); border-color: var(--accent); }
.tl .when { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.tl h3 { font-size: 15px; letter-spacing: 0.1em; }
.tl p { color: var(--muted); font-size: 14.5px; max-width: 52ch; }

.accs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 20px); }
.acc-tile { display: grid; gap: 10px; }
.acc-tile .ph { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; }
.acc-tile h3 { font-size: 13px; letter-spacing: 0.12em; }
.acc-tile p { font-size: 13.5px; color: var(--muted); }
.faq { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(28px, 5vw, 80px); align-items: start; }

@media (max-width: 1020px) {
  .plan, .faq { grid-template-columns: minmax(0, 1fr); }
  .plan-head { position: static; }
  .accs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .looks { grid-template-columns: minmax(0, 1fr); }
  .roles { display: flex; }
  .role { flex: 1; padding: 12px 10px; }
}
</style>
