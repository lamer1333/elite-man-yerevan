<head>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+Armenian:wght@300;400;500&display=swap">
<link rel="stylesheet" href="em-pages.css">
<style>
/* Atelier: Huntsman's bespoke page (hero, short manifesto, numbered process), the homepage fabric library and look builder */
.intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(24px, 5vw, 80px); align-items: start; }
.intro h2 { font-size: clamp(20px, 2vw, 28px); line-height: 1.25; }
.intro-txt { display: grid; gap: 14px; color: var(--muted); max-width: 58ch; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: clamp(32px, 4vw, 56px); }
.fact { padding: 22px 18px 22px 0; display: grid; gap: 4px; }
.fact + .fact { border-left: 1px solid var(--line); padding-left: 18px; }
.fact b { font-weight: 400; font-size: clamp(22px, 2.4vw, 32px); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; color: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(14px, 1.8vw, 24px); counter-reset: step; }
.step { display: grid; gap: 12px; align-content: start; }
.step .ph { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; }
.step-n { font-size: 12px; letter-spacing: 0.16em; color: var(--accent); }
.step h3 { font-size: 15px; letter-spacing: 0.1em; line-height: 1.3; }
.step p { font-size: 14.5px; color: var(--muted); }
.step .when { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); border-top: 1px solid var(--line); padding-top: 10px; }

/* Fabric library (from the homepage) */
.fab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: clamp(28px, 4vw, 64px); align-items: start; }
.fab-text { display: grid; gap: 16px; align-content: start; position: sticky; top: calc(var(--hh) + 30px); }
.fab-text p { color: var(--muted); max-width: 46ch; }
.filters { display: grid; gap: 10px; margin-top: 6px; }
.detail { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 14px; margin-top: 8px; }
.detail h3 { font-size: 22px; }
.detail-price { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.detail-price b { font-weight: 400; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.count { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 12px; }
.sw { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; display: grid; gap: 8px; color: inherit; font: inherit; animation: up .5s var(--ease) both; animation-delay: calc(var(--d, 0) * 40ms); }
.sw canvas { width: 100%; aspect-ratio: 1 / 1; display: block; transition: opacity .2s; }
.sw:hover canvas { opacity: .88; }
.sw[aria-pressed="true"] canvas { outline: 1px solid var(--ink); outline-offset: 4px; }
.sw small { font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.sw[aria-pressed="true"] small { color: var(--ink); }
.empty { color: var(--muted); grid-column: 1 / -1; padding: 24px 0; }

/* Look of the month (from the homepage) */
.look-band { background: var(--soft); }
.look { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(24px, 4vw, 64px); align-items: center; }
.stage { position: relative; display: grid; place-items: center; min-height: 560px; min-width: 0; }
.figure { width: min(100%, 300px); height: auto; display: block; filter: drop-shadow(0 18px 24px #0000001f); }
.figure .part { transition: opacity .35s ease; }
.figure .part.flash { animation: flash .5s ease; }
@keyframes flash { 0% { opacity: .2; } 100% { opacity: 1; } }
.tag { position: absolute; display: flex; align-items: center; gap: 10px; background: var(--paper); padding: 8px 12px 8px 8px; box-shadow: 0 6px 18px #0000000f; font-size: 12.5px; line-height: 1.25; max-width: 180px; transition: transform .4s var(--ease); }
.tag i { width: 30px; height: 30px; flex: none; background-size: cover; border: 1px solid var(--line); }
.tag b { display: block; font-weight: 400; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tag.t1 { left: 0; top: 18%; } .tag.t2 { right: 0; top: 48%; } .tag.t3 { left: 2%; bottom: 10%; }
.tag.pop { animation: pop .45s var(--ease); }
@keyframes pop { 0% { transform: scale(.92); } 100% { transform: none; } }
.look-side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-width: 0; }
.look-side p { color: var(--muted); max-width: 46ch; }
.rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 4px; }
.rows > div { min-width: 0; }
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.opt { flex: none; width: 58px; height: 58px; border: 1px solid var(--line); background: var(--paper) center / cover; cursor: pointer; padding: 0; transition: transform .25s var(--ease), outline-color .2s; outline: 1px solid transparent; outline-offset: 3px; }
.opt:hover { transform: translateY(-2px); }
.opt[aria-pressed="true"] { outline-color: var(--ink); }
.look-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.look-total b { font-weight: 400; font-size: 18px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }

/* Details you choose */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 1.8vw, 24px); }
.choice { border-top: 1px solid var(--ink); padding-top: 16px; display: grid; gap: 8px; align-content: start; }
.choice h3 { font-size: 14px; letter-spacing: 0.12em; }
.choice ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--muted); font-size: 14.5px; }

@media (max-width: 1020px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 36px; }
  .fab, .look, .intro { grid-template-columns: minmax(0, 1fr); }
  .fab-text { position: static; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact:nth-child(3) { border-left: 0; padding-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage { min-height: 0; padding-block: 8px 0; }
  .figure { width: min(62vw, 240px); }
  .tag { position: static; max-width: none; box-shadow: none; border: 1px solid var(--line); padding: 6px; gap: 6px; font-size: 11.5px; }
  .tag i { width: 22px; height: 22px; }
  .tags { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 14px; width: 100%; }
  .choices { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 440px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tags { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

    </div>
  </section>

  <section>

        <article class="step rv settle" style="--d:3"><div class="ph"><img data-ph src="img/atelier-step-4.jpg" alt=""><span class="ph-label">atelier-step-4.jpg · 4:5</span></div><div class="step-n">04</div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p><div class="when" data-i18n="s4_w"></div></article>

    </div>

        <div class="tags" id="tags">

  <section class="booking-band" id="booking"></section>

    rail("railJ", JK, "j", function (id) { return EM.clothURL(byId[id], 60); }, function (id) { return byId[id].n[lang]; });
    rail("railT", TR, "t", function (id) { return EM.clothURL(byId[id], 60); }, function (id) { return byId[id].n[lang]; });
    rail("railS", SHIRTS, "s", function (x) { return swatchURL(x.c); }, function (x) { return t(x.k); });
    rail("railO", SHOES, "o", function (x) { return swatchURL(x.c); }, function (x) { return t(x.k); });
  }
  document.getElementById("lkBook").addEventListener("click", function () {
    var lang = EM.lang();
    EM.prefill("mtm", t("lk_booknote", { j: byId[look.j].n[lang], t: byId[look.t].n[lang], s: t(SHIRTS[look.s].k), o: t(SHOES[look.o].k) }));
  });

  EM.onLang(function () {
    var k = Math.round(minPrice / 1000), l = EM.lang();
    document.getElementById("fromPrice").textContent = l === "en" ? "from ֏" + k + "k" : l === "hy" ? k + " հզ. ֏-ից" : "от " + k + " тыс. ֏";
    renderFilters(); renderSwatches(false); renderRails(); renderLook();
  });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { renderSwatches(false); }, 150); });
  EM.start();
})();
</script>
