<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="em-pages.css">
<style>
/* Contents page: the site's header and footer around a plain list of pages, each with a cloth swatch from its own world */
.idx-head { display: grid; gap: 12px; padding-block: clamp(40px, 6vw, 80px) clamp(24px, 3vw, 40px); }
.idx-head h1 { font-size: clamp(28px, 3.6vw, 48px); line-height: 1.05; letter-spacing: 0.14em; }
.pages { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.pg { border-bottom: 1px solid var(--line); }
.pg a { display: grid; grid-template-columns: 72px minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 14px clamp(16px, 3vw, 40px); align-items: center; padding-block: 18px; text-decoration: none; }
.pg canvas { width: 72px; height: 72px; display: block; transition: transform .6s var(--ease); }
.pg h2 { font-size: clamp(16px, 1.5vw, 20px); letter-spacing: 0.1em; transition: color .2s; }
.pg .file { display: block; margin-top: 4px; font: 400 11.5px/1.3 ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: 0; }
.pg p { color: var(--muted); font-size: 14.5px; }
.pg .go { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.pg .go::after { content: "→"; transition: transform .3s var(--ease); }
.pg a:hover h2 { color: var(--accent); }
.pg a:hover canvas { transform: scale(1.06); }
.pg a:hover .go::after { transform: translateX(4px); }
.idx-note { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 3vw, 40px); padding-block: clamp(40px, 5vw, 64px); }
.idx-note div { display: grid; gap: 6px; align-content: start; }
.idx-note p { color: var(--muted); font-size: 14.5px; }
.idx-foot { background: var(--footer); color: var(--footer-muted); font-size: 12.5px; padding-block: 22px; }
.idx-foot .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hdr-in .spacer { min-width: 1px; }
@media (max-width: 760px) {
  .pg a { grid-template-columns: 56px minmax(0, 1fr); align-items: start; }
  .pg canvas { width: 56px; height: 56px; }
  .pg p, .pg .go { grid-column: 2; }
  .idx-note { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="ribbon" data-i18n="ribbon"></div>
<header class="hdr">
  <div class="wrap hdr-in">
    <div class="spacer"></div>
    <a class="logo" href="elite-man-home.html" aria-label="Elite Man Yerevan"><b>Elite Man</b><i>Yerevan</i></a>
    <div class="hdr-right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="hy" id="lang-hy">HY</button>
        <button type="button" data-lang="ru" id="lang-ru">RU</button>
        <button type="button" data-lang="en" id="lang-en">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="idx-head">
      <div class="label" data-i18n="i_label"></div>

    <ol class="pages" id="pages"></ol>
    <div class="idx-note">
      <div><div class="label" data-i18n="n1_t"></div><p data-i18n="n1_d"></p></div>
      <div><div class="label" data-i18n="n2_t"></div><p data-i18n="n2_d"></p></div>
      <div><div class="label" data-i18n="n3_t"></div><p data-i18n="n3_d"></p></div>
    </div>
  </div>
</main>
<footer class="idx-foot"><div class="wrap"><span>© 2026 Elite Man Yerevan · <span data-i18n="addr"></span></span><span data-i18n="foot"></span></div></footer>
